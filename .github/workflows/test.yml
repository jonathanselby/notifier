name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o ./bin/notifier ./cmd/notifier
      - name: Version contract
        run: test "$(./bin/notifier -version)" = "notifier 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/notifier-linux-arm64 ./cmd/notifier
      - name: Bafflewick acceptance
        shell: bash
        run: |
          rm -f /tmp/bafflewick-alerts.log
          out=$(./bin/notifier -config examples/bafflewick/config.json -request examples/bafflewick/request.json)
          echo "$out" | grep -q '"status":"delivered"'
          grep -q 'Bafflewick break-glass activated' /tmp/bafflewick-alerts.log
      - name: Delivery-boundary acceptance
        run: >-
          go test ./internal/notify
          -run 'TestLocalAndHTTPOutcomes|TestExerciseSuppressesExternalBeforeIO|TestHTTPCannotMasqueradeAsLocal|TestTimeoutVisible|TestOneFailureDoesNotHideLaterOutcome|TestValidateConfigAndRequest'
          -count=1
